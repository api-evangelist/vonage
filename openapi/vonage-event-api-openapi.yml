openapi: 3.2.0
info:
  title: Vonage Event API
  version: 5.5.1
  contact:
    name: Vonage DevRel
    email: devrel@vonage.com
    url: https://developer.nexmo.com/
  x-metaDescription: Find quick answers to questions about the Vonage Conversation API (v1.0) in this reference guide. Learn more in Vonage's API documentation.
  x-metaTitle: Vonage Conversation API (v1.0) Reference | Vonage API Documentation
  description: 'Operations tagged event across 2 of this provider''s published API definitions: vonage-conversation-openapi.json, vonage-conversation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.nexmo.com/v1
security:
- bearerAuth: []
tags:
- name: Event
paths:
  /conversations/{conversation_id}/events:
    post:
      operationId: createEvent
      description: 'Events are used to record actions that take place within a conversation. Some events are created automatically when carrying out actions such as adding a user to a conversation, but you can also create custom events to record other actions that take place within a conversation.

        For more details on event types and how they should be used please see the

        event concept documentation.'
      tags:
      - Event
      summary: Create an event
      parameters:
      - $ref: '#/components/parameters/conversation_id'
      requestBody:
        $ref: '#/components/requestBodies/event'
      responses:
        '201':
          $ref: '#/components/responses/event'
        '401':
          $ref: '#/components/responses/General401InvalidToken'
        '404':
          $ref: '#/components/responses/Conversation404'
        '500':
          $ref: '#/components/responses/General500InternalError'
    get:
      operationId: getEvents
      tags:
      - Event
      summary: Get a list of events
      parameters:
      - $ref: '#/components/parameters/event_start_id'
      - $ref: '#/components/parameters/event_end_id'
      - $ref: '#/components/parameters/event_type'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/exclude_deleted_events'
      - $ref: '#/components/parameters/conversation_id'
      responses:
        '200':
          $ref: '#/components/responses/event_list'
        '401':
          $ref: '#/components/responses/General401InvalidToken'
        '404':
          $ref: '#/components/responses/Conversation404'
        '500':
          $ref: '#/components/responses/General500InternalError'
    servers:
    - url: https://api.nexmo.com/v1
  /conversations/{conversation_id}/events/{event_id}:
    get:
      operationId: getEvent
      tags:
      - Event
      summary: Get an event
      parameters:
      - $ref: '#/components/parameters/conversation_id'
      - $ref: '#/components/parameters/event_id'
      responses:
        '200':
          $ref: '#/components/responses/event_single'
        '401':
          $ref: '#/components/responses/General401InvalidToken'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/conversation_error_not_found'
                - $ref: '#/components/schemas/event_error_not_found'
        '500':
          $ref: '#/components/responses/General500InternalError'
    delete:
      operationId: deleteEvent
      tags:
      - Event
      summary: Delete an event
      description: Only message and custom events can be deleted, and then only events your user created or if you use an admin token
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          $ref: '#/components/schemas/conversation_id'
        description: The conversation ID
      - in: path
        name: event_id
        required: true
        schema:
          $ref: '#/components/schemas/event_id'
        description: The event ID
      responses:
        '204':
          $ref: '#/components/responses/General204'
        '401':
          $ref: '#/components/responses/General401InvalidToken'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/conversation_error_not_found'
                - $ref: '#/components/schemas/event_error_not_found'
        '500':
          $ref: '#/components/responses/General500InternalError'
    servers:
    - url: https://api.nexmo.com/v1
components:
  schemas:
    timestamp_updated:
      type: string
      example: '2020-01-01T14:05:00.00Z'
      description: Time of last update
    ephemeral_event:
      description: ephemeral - Ephemeral
      type: object
      properties:
        type:
          type: string
          enum:
          - ephemeral
        from:
          description: Member ID
          type: string
        body:
          type: object
          description: any custom data you wish to send/receive.
      required:
      - type
      - body
    messageseen_event_response:
      description: message:seen - Message seen
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - message:seen
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            event_id:
              type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    audiodtmf_body_digit:
      description: Digit no method and duration
      properties:
        digit:
          type: string
          pattern: ^([abcdABCD0-9*#pPeEfF])+$
        channel:
          $ref: '#/components/schemas/event_channel'
        dtmf_seq:
          type: integer
        method:
          type: string
          enum:
          - in
        duration:
          type: integer
      required:
      - digit
      - method
      - duration
    conversation_numbers_sip:
      description: SIP Channel
      type: object
      properties:
        type:
          type: string
          enum:
          - sip
          example: sip
        uri:
          type: string
          maxLength: 200
          pattern: ^(sip|sips):\+?([\w|:.\-@;,=%&]+)
          example: sip:+Htg:;xa
        usenname:
          type: string
        password:
          type: string
      required:
      - type
      - uri
    audiomuteon_event:
      description: audio:mute:on - Mute audio
      type: object
      properties:
        type:
          type: string
          enum:
          - audio:mute:on
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            rtc_id:
              type: string
          required:
          - rtc_id
      required:
      - type
      - body
    audiorecorddone_event_response:
      description: audio:record:done - Recording the audio has completed
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - audio:record:done
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            event_id:
              type: integer
            recording_id:
              type: string
            destination_url:
              type: string
            format:
              type: string
            start_time:
              type: string
              example: '2020-01-01T14:00:00.00Z'
            end_time:
              type: string
              example: '2020-01-01T14:00:00.00Z'
            size:
              type: integer
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    conversation_numbers_vbc:
      description: VBC Channel
      type: object
      properties:
        type:
          type: string
          enum:
          - vbc
          example: vbc
        extension:
          type: string
          example: '447700900000'
      required:
      - type
      - extension
    user_properties:
      type: object
      description: User properties
      properties:
        custom_data:
          type: object
    event_media_boolean:
      type: object
      description: Media Object with boolean audio
      properties:
        audio_settings:
          type: object
          properties:
            enabled:
              type: boolean
            earmuffed:
              type: boolean
            muted:
              type: boolean
        audio:
          type: boolean
    audiosaystop_event:
      description: audio:say:stop - Stop currently playing TTS
      type: object
      properties:
        type:
          type: string
          enum:
          - audio:say:stop
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            say_id:
              type: string
          required:
          - say_id
      required:
      - type
      - body
    audioplaystop_event_response:
      description: audio:play:stop - Stop currently playing audio
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - audio:play:stop
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            play_id:
              type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    timestamp_res_conversation:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/timestamp_created'
        updated:
          $ref: '#/components/schemas/timestamp_updated'
        destroyed:
          $ref: '#/components/schemas/timestamp_destroyed'
    rtchangup_event_response:
      description: rtc:hangup - RTC hangup
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - rtc:hangup
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            direction:
              type: string
              enum:
              - inbound
              - outbound
            quality:
              type: object
              properties:
                mos_score:
                  type: number
                quality_percentage:
                  type: number
                jitter_min_var:
                  type: number
                jitter_max_var:
                  type: number
                jitter_loss_rate:
                  type: number
                jitter_burst_rate:
                  type: number
                flaw_total:
                  type: number
                packet_cnt:
                  type: number
                packet_loss_perc:
                  type: number
            bandwidth:
              type: object
              properties:
                byte_in:
                  type: number
                byte_out:
                  type: number
            channel:
              $ref: '#/components/schemas/event_audio_channels'
            reason:
              type: object
              properties:
                text:
                  type: string
                code:
                  type: string
                sip_code:
                  type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    messageundeliverable_event:
      description: message:undeliverable - Message undeliverable
      type: object
      properties:
        type:
          type: string
          enum:
          - message:undeliverable
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            event_id:
              type: string
          required:
          - event_id
      required:
      - type
      - body
    conversation_error_not_found:
      type: object
      description: Conversation not found
      properties:
        title:
          type: string
          example: Not found.
        type:
          type: string
          example: https://developer.nexmo.com/api/conversation#conversation:error:not-found
        code:
          type: string
          example: conversation:error:not-found
        detail:
          type: string
          example: Conversation does not exist, or you do not have access.
        instance:
          type: string
          example: 00a5916655d650e920ccf0daf40ef4ee
    rtcanswered_event_response:
      description: rtc:answered - RTC answered
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - rtc:answered
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            direction:
              type: string
              enum:
              - inbound
              - outbound
            channel:
              $ref: '#/components/schemas/event_audio_channels'
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    audiodtmf_body_digits_no_method:
      description: Digits no method and duration
      properties:
        digits:
          type: string
          pattern: ^([abcdABCD0-9*#pPeEfF])+$
        channel:
          $ref: '#/components/schemas/event_channel'
        dtmf_seq:
          type: integer
      required:
      - digits
    event_links:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
    event_id:
      type: string
      example: '5'
      description: Event id. This is a progressive integer
    audioplay_event_response:
      description: audio:play - Play Audio
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - audio:play
        from:
          description: Member ID
          type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
        body:
          type: object
          properties:
            queue:
              type: boolean
            level:
              type: number
              exclusiveMinimum: -1
              exclusiveMaximum: 1
            loop:
              type: integer
            stream_url:
              type: array
              items:
                type: string
    conversation_id:
      type: string
      example: CON-d66d47de-5bcb-4300-94f0-0c9d4b948e9a
      description: The unique identifier for this conversation
    memberleft_event_response:
      description: member:left - Member Jeft
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - member:left
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            member_id:
              type: string
            user:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/user_id'
                member_id:
                  type: string
                user_id:
                  type: string
                name:
                  $ref: '#/components/schemas/user_name'
                display_name:
                  $ref: '#/components/schemas/user_display_name'
                image_url:
                  $ref: '#/components/schemas/user_image_url'
                properties:
                  $ref: '#/components/schemas/user_properties'
                media:
                  oneOf:
                  - $ref: '#/components/schemas/event_media_boolean'
                  - $ref: '#/components/schemas/event_media'
            channel:
              oneOf:
              - $ref: '#/components/schemas/event_sms_channel'
              - $ref: '#/components/schemas/event_mms_channel'
              - $ref: '#/components/schemas/event_whatsapp_channel'
              - $ref: '#/components/schemas/event_viber_channel'
              - $ref: '#/components/schemas/event_messenger_channel'
            timestamp:
              type: object
              properties:
                invited:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
                left:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
                joined:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
            initiator:
              type: object
              properties:
                joined:
                  type: object
                  properties:
                    isSystem:
                      type: boolean
                    member_id:
                      type: string
                    user_id:
                      type: string
                left:
                  type: object
                  properties:
                    isSystem:
                      type: boolean
                    member_id:
                      type: string
                    user_id:
                      type: string
            reason:
              type: object
              properties:
                code:
                  type: string
                text:
                  type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    user_id:
      type: string
      example: USR-82e028d9-5201-4f1e-8188-604b2d3471ec
      description: User ID
    sipmachine_event_response:
      description: sip:machine - SIP machine
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - sip:machine
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            type:
              type: string
            confidence:
              type: integer
            channel:
              $ref: '#/components/schemas/event_audio_channels'
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    message_body_text:
      description: Text Message Body
      type: object
      properties:
        message_type:
          type: string
          enum:
          - text
        text:
          type: string
    audiodtmf_event:
      description: audio:dtmf - Play DTMF audio
      type: object
      properties:
        type:
          type: string
          enum:
          - audio:dtmf
        from:
          description: Member ID
          type: string
        body:
          description: method and duration are added when you want any IP user in a call to not only recieve the event but hear the dialtones in the mixer.
          oneOf:
          - $ref: '#/components/schemas/audiodtmf_body_digit_no_method'
          - $ref: '#/components/schemas/audiodtmf_body_digits_no_method'
          - $ref: '#/components/schemas/audiodtmf_body_digit'
          - $ref: '#/components/schemas/audiodtmf_body_digits'
      required:
      - type
      - body
    audiorecordstop_event_response:
      description: audio:record:stop - Stop current recording of audio
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - audio:record:stop
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            record_id:
              type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    leg_status_history_knocker:
      type: object
      description: Leg Status History with Knocker ID
      properties:
        knocker_id:
          type: string
        status:
          type: string
          enum:
          - started
          - ringing
          - answered
          - completed
          - machine
          - failed
          - busy
          - timeout
          - cancelled
          - rejected
        state:
          oneOf:
          - $ref: '#/components/schemas/leg_status_complete'
          - $ref: '#/components/schemas/leg_status'
        date:
          type: string
    event_whatsapp_channel:
      description: Whatsapp Channel
      type: object
      properties:
        to:
          type: object
          properties:
            number:
              type: string
        from:
          type: object
          properties:
            number:
              type: string
        type:
          type: string
          enum:
          - whatsapp
    message_body_custom:
      description: Custom Message Body
      type: object
      properties:
        message_type:
          type: string
          enum:
          - custom
        custom:
          type: object
          properties:
            custom_field:
              type: string
    memberjoined_event_response:
      description: member:joined - Member Joined
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - member:joined
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            member_id:
              type: string
            user:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/user_id'
                member_id:
                  type: string
                user_id:
                  type: string
                name:
                  $ref: '#/components/schemas/user_name'
                display_name:
                  $ref: '#/components/schemas/user_display_name'
                image_url:
                  $ref: '#/components/schemas/user_image_url'
                properties:
                  $ref: '#/components/schemas/user_properties'
                media:
                  oneOf:
                  - $ref: '#/components/schemas/event_media_boolean'
                  - $ref: '#/components/schemas/event_media'
            channel:
              oneOf:
              - $ref: '#/components/schemas/event_sms_channel'
              - $ref: '#/components/schemas/event_mms_channel'
              - $ref: '#/components/schemas/event_whatsapp_channel'
              - $ref: '#/components/schemas/event_viber_channel'
              - $ref: '#/components/schemas/event_messenger_channel'
            timestamp:
              type: object
              properties:
                invited:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
                left:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
                joined:
                  type: string
                  example: '2020-01-01T14:00:00.00Z'
            initiator:
              type: object
              properties:
                joined:
                  type: object
                  properties:
                    isSystem:
                      type: boolean
                    member_id:
                      type: string
                    user_id:
                      type: string
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    sipstatus_event_response:
      description: sip:status - Status of SIP
      type: object
      properties:
        id:
          type: integer
          description: Event id. This is a progressive integer
        type:
          type: string
          enum:
          - sip:status
        from:
          description: Member ID
          type: string
        body:
          type: object
          properties:
            price:
              type: string
            rate:
              type: string
            duration:
              type: string
            to:
              type: string
            from:
              type: string
            network_code:
              type: string
            channel:
              $ref: '#/components/schemas/event_audio_channels'
            request_time:
              type: string
            start_time:
              type: string
            end_time:
              type: string
            status:
              type: string
              enum:
              - started
              - ringing
              - answered
              - completed
              - machine
              - failed
              - busy
              - timeout
              - cancelled
              - rejected
            direction:
              type: string
              enum:
              - in
              - out
            state:
              oneOf:
              - $ref: '#/components/schemas/leg_status'
              - $ref: '#/components/schemas/leg_status_complete'
        timestamp:
          $ref: '#/components/schemas/timestamp_created'
        _embedded:
          $ref: '#/components/schemas/embedded_event_from'
        _links:
          $ref: '#/components/schemas/event_links'
    audiodtmf_body_digit_no_method:
      description: Digit no method and duration
      properties:
        digit:
          type: string
          pattern: ^([abcdABCD0-9*#pPeEfF])+$
        channel:
          $ref: '#/components/schemas/event_channel'
        dtmf_seq:
          type: integer
      required:
      - digit
    message_event:
      description: message - Message (Text, Image, Audio, Video, File, Template, Custom, VCard, Location, Random)
      type: object
      properties:
        type:
          type: string
          enum:
          - message
        from:
          description: Member ID
          type: string
        body:
          type: object
          oneOf:
          - $ref: '#/components/schemas/message_body_text'
          - $ref: '#/components/schemas/message_body_image'
          - $ref: '#/components/schemas/message_body_audio'
          - $ref: '#/components/schemas/message_body_video'
          - $ref: '#/components/schemas/message_body_file'
          - $ref: '#/components/schemas/message_body_template'
          - $ref: '#/components/schemas/message_body_custom'
          - $ref: '#/components/schemas/message_body_vcard'
          - $ref: '#/components/schemas/message_body_location'
