note: 'Vonage publishes no single rate-limit page (developer.vonage.com/en/getting-started/concepts/rate-limits
  returns 404); the limits are spread across support-center articles, one per product, so each row carries its own
  source: URL and limit_text is verbatim from THAT page. The top-level source is the SMS throughput article; rows
  quoted from other articles will not be found on it by a single-page checker.'
headers:
  X-RateLimit-Limit: declared on 429 responses in the Account, Messages and Reports OpenAPI documents
  X-RateLimit-Remaining: same documents
  X-RateLimit-Reset: same documents
  Retry-After: same documents
exhaustion:
  status: 429
  problem_type: throttled
  problem_text: You have hit the rate limit for the API — Retry the request after waiting (differs per API)
  source: https://developer.vonage.com/en/api-errors
limits:
- name: SMS API default throughput
  scope: per API key
  window: 1 second
  max: 30
  limit_text: All API keys are set with 30 API requests per second throughput restriction by default.
  endpoint: POST /sms/{format}
  operationId: send-an-sms
  source: https://api.support.vonage.com/hc/en-us/articles/203993598-What-is-the-Throughput-Limit-for-Outbound-SMS
- name: Voice API calls per second
  scope: per account, shared across all Voice products
  window: 1 second
  max: 3
  limit_text: The maximum throughput is 3 calls per second (CPS).
  endpoint: POST /v1/calls
  operationId: createCall
  source: https://api.support.vonage.com/hc/en-us/articles/207100288-How-many-calls-can-I-create-per-second
- name: Verify API requests per second
  scope: per account
  window: 1 second
  max: 30
  limit_text: Throughput is set at account level and by default is 30 Verify API requests per second.
  source: https://api.support.vonage.com/hc/en-us/articles/204103233-What-is-the-maximum-amount-of-concurrent-Verify-requests-per-account
- name: Numbers API requests per second
  scope: per account
  window: 1 second
  max: 3
  limit_text: Vonage lets you send your API request to manage your Numbers at a rate of 3 API requests per second
    (180 API requests per minute).
  source: https://api.support.vonage.com/hc/en-us/articles/5667853760284-How-fast-can-I-send-Numbers-API-requests
- name: Numbers API /account/numbers
  scope: per account
  window: 1 second
  max: 1
  limit_text: For the /account/numbers endpoint it is 1 per second.
  endpoint: GET /account/numbers
  operationId: getOwnedNumbers
  source: https://api.support.vonage.com/hc/en-us/articles/5667853760284-How-fast-can-I-send-Numbers-API-requests
- name: Redact API requests per second
  scope: per account
  window: 1 second
  max: 170
  limit_text: Vonage lets you send your API request to manage your Numbers at a rate of 170 API requests per second
  endpoint: POST /v1/redact/transaction
  operationId: redact-message
  source: https://api.support.vonage.com/hc/en-us/articles/6918048541596-How-fast-can-I-send-Redact-API-requests
- name: Reports API synchronous requests
  scope: per account
  window: 1 second
  max: 10
  limit_text: 'Synchronous Request : 10 requests per second.'
  operationId: createSyncReportPublic
  source: https://api.support.vonage.com/hc/en-us/articles/4407771966868-How-many-Reports-API-requests-can-be-submitted-in-a-second
- name: Reports API asynchronous requests
  scope: per account
  window: 1 second
  max: 5
  limit_text: 'Asynchronous Requests : 5 requests per second.'
