    oauth-protected-resource: 404
    oauth-authorization-server: 404
    agent-card.json: 404
- name: api-bindings
  purpose: Also known as our Tooling MCP Server, it provides tools for managing Vonage applications, numbers, and
    reports programmatically.
  mode: local-stdio
  install: npx -y @vonage/vonage-mcp-server-api-bindings
  package: https://www.npmjs.com/package/@vonage/vonage-mcp-server-api-bindings
  version: 1.5.1
  published: '2026-05-27'
  auth: api-key
  auth_env:
  - VONAGE_APPLICATION_ID
  - VONAGE_PRIVATE_KEY64
  - VONAGE_API_KEY
  - VONAGE_API_SECRET
  - VONAGE_VIRTUAL_NUMBER
  - VONAGE_WHATSAPP_NUMBER
  - RCS_SENDER_ID
  verified: searched
  tool_count: 14
  tools_source: npm README tool table (documented, not observed from a running server)
docs: https://developer.vonage.com/en/mcp-server/overview
tools:
- server: documentation
  name: vonage_docs_search
  description: Searches the official Vonage developer documentation for guides, tutorials, and API references. This
    is the primary tool for general queries about Vonage's products, services, and APIs, and should be used when
    the user asks for information, documentation, or how-to guides.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: The user's search query, which can be a keyword, phrase, or a question about Vonage's APIs
          or documentation
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_code_generator
  description: Generates a complete, runnable code snippet in a specified programming language for a given Vonage
    API task. This is the preferred tool when the user explicitly asks for a 'code snippet,' 'example,' or 'code
    in a specific language' like Node.js, Python, or cURL.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: A clear and concise description of the task for which the code snippet is needed (e.g., 'send
          an SMS', 'make a voice call').
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_api_reference
  description: Provides a direct link or detailed information from the Vonage API reference documentation for a
    specific API endpoint. Use this when the user's query is highly technical and related to a specific endpoint,
    like API parameters, request bodies, or response schemas.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: The name of the Vonage API (e.g., 'SMS API', 'Voice API', 'Messages API').
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_troubleshooter
  description: Provides troubleshooting steps, common error code explanations, and debugging advice for Vonage API
    issues. Use this when the user is reporting a problem, error, or something not working as expected.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: A description of the problem or error the user is experiencing, including any error messages,
          codes, or unexpected behavior.
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_tutorial_finder
  description: Finds and provides a link to a step-by-step tutorial or a blog post on the Vonage Developer blog.
    This tool is for when the user asks for a 'tutorial' or a 'guide' on a specific topic.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: The topic of the tutorial or guide (e.g., 'building a voice proxy', 'two-factor authentication',
          'receiving a delivery receipt').
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_sdk_info
  description: Retrieves information about a specific Vonage SDK, including installation instructions, supported
    features, and version numbers. This is for queries focused on the SDKs themselves, not the underlying APIs.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: The programming language of the SDK (e.g., 'Node.js', 'Python', 'PHP').
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
- server: documentation
  name: vonage_use_case_examples
  description: Finds and describes real-world use cases or customer stories for a specific Vonage product. Use this
    when the user asks for examples of how a product is used in a specific industry or for a particular purpose.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: The Vonage product (e.g., 'Video API', 'Voice API', 'Messages API').
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
  verified: probed
