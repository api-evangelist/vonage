          type: string
          description: Indicates the voice quality used for the Voice TTS event. Can be one of standard, premium, or premier.
          enum:
          - standard
          - premium
          - premier
          example: standard
        tts_level:
          type: string
          description: Indicates whether the TTS action was applied at the call leg level or at the conversation level. `leg` — TTS was played to a specific call leg only. `conversation` — TTS was played to the entire conversation.
          enum:
