format: RFC 7807 application/problem+json (generic errors); legacy per-product numeric status codes (SMS, Messages,
  Conversation)
envelope:
  content_type: application/problem+json
  fields:
  - type
  - title
  - detail
  - instance
  example:
    type: https://example.com/Error#out-of-credit
    title: You do not have enough credit
    detail: Your current balance is 30, but that costs 50.
    instance: <trace_id>
  statement: When a Vonage API returns an error, for instance, if your account has no credit, the API will return
    an error in RFC 7807 format.
generic:
- code: low-balance
  description: This request could not be performed due to your account balance being low.
  resolution: Top up your account in the Vonage Dashboard
- code: unauthorized
  description: You did not provide correct credentials.
  resolution: Check your authentication credentials are correct, you can find these credentials in the Vonage Dashboard
- code: forbidden
  description: Your account does not have permission to perform this action
  resolution: Check that you're using the correct credentials, and that your account has this feature enabled
- code: not-found
  description: The requested resource does not exist, or you do not have access to it
  resolution: Check both the URI that you're requesting and your authentication credentials
- code: unprovisioned
  description: The credentials provided do not have access to the requested product
  resolution: Check your API key is correct and has been whitelisted
- code: account-suspended
  description: This account has been suspended
  resolution: Contact support for more information
- code: jwt-expired
  description: The JWT provided has expired
  resolution: Generate a new JWT with an exp in the future
- code: jwt-revoked
  description: The JWT provided has been revoked
  resolution: Generate a new JWT using your private key
- code: invalid-api-key
  description: The API key provided does not exist in our system, or you do not have access
  resolution: Modify your request to provide a valid API key
- code: invalid-params
  description: The value of one or more parameters is invalid
  resolution: Resend a valid request body
- code: invalid-signature
  description: The signature provided did not validate.
  resolution: Check your signature secret is correct and you're following the correct signing process
- code: invalid-ip
  description: The source IP address of the request is not in our allow list
  resolution: Make a request from an allowed IP address, or add your current IP to the list of authorized addresses
- code: multiple-auth-methods
  description: Multiple authentication methods were detected in your request
  resolution: Provide exactly one authentication method
- code: invalid-id
  description: The ID provided does not exist in our system
  resolution: Modify your request to provide a valid ID
- code: invalid-json
  description: The request body did not contain valid JSON
  resolution: Send a JSON request body, including a Content-Type header of application/json
- code: throttled
  description: You have hit the rate limit for the API
  resolution: Retry the request after waiting (differs per API)
- code: wrong-verb
  description: This endpoint does not support the HTTP verb that you requested
  resolution: Read the API documentation to see which verbs your desired endpoint supports
- code: accept-header
  description: Invalid Accept header provided
  resolution: Most Vonage APIs only send back application/json. Check the API documentation for the API that you're
    working with for a complete list of supported data types
- code: content-type-header
  description: Invalid Content-Type header provided
  resolution: Most Vonage APIs only accept application/json. Check the API documentation for the API that you're
    working with for a complete list of supported data types
- code: unavailable-legal
  description: Unavailable For Legal Reasons
  resolution: 'Vonage APIs are unavailable in the following areas due to international sanctions: Sudan, Syria,
    Crimea, North Korea, Iran, Cuba'
- code: application-suspended
  description: This application has been suspended
  resolution: Re-enable the application or create a new application to use
