# x-archived-from: vonage-verify-v2-openapi.yml
# x-archived-on: 2026-10-08
openapi: 3.0.2
info:
  title: Verify API
  x-metaTitle: Vonage Verify v2.0 API Reference | Vonage API Documentation
  x-metaDescription: Find quick answers to questions about the Vonage Verify API (v2.0) in this reference guide. Learn more
    in Vonage's API documentation.
  version: 1.0.1
  description: 'Verify API provides a choice of routes for sending a code to a user. You can use this to confirm a user''s
    contact information, as a second factor when authenticating users, or for step-up authentication.

    '
  contact:
    name: Vonage DevRel
    email: devrel@vonage.com
    url: https://developer.vonage.com/
servers:
- url: https://api.nexmo.com/v2/verify
tags:
- name: Verify
  description: Provides 2FA authentication for end-users.
- name: Templates
  description: Create and modify custom templates in Verify
- name: Template Fragments
  description: Create and modify custom template fragments in Verify
paths:
  /:
    post:
      operationId: newRequest
      summary: Request a verification be sent to a user
      tags:
      - Verify
      description: Start the verification process to a given channel(s).
      security:
      - basicAuth: []
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/VerificationRequest'
      responses:
        '202':
          description: The request was started
          content:
            application/json:
              schema:
                required:
                - request_id
                type: object
                properties:
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                  check_url:
                    type: string
                    description: The URL to complete the Silent Authentication verification process. It is returned only when
                      Silent Auth is the initial verification channel in the workflow and the network supports it, unless
                      `coverage_check` is set to `false`. See the [documentation](https://developer.vonage.com/en/verify/concepts/silent-authentication#availability)
                      for supported network availability.
                    example: https://api.nexmo.com/v2/verify/c11236f4-00bf-4b89-84ba-88b25df97315/silent-auth/redirect
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        '412':
          $ref: '#/components/responses/ErrorResponse412'
        '422':
          $ref: '#/components/responses/ErrorResponse422'
        '429':
          $ref: '#/components/responses/ErrorResponse429'
        '500':
          $ref: '#/components/responses/ErrorResponse500'
  /{request_id}:
    parameters:
    - $ref: '#/components/parameters/request_id'
    post:
      operationId: checkCode
      summary: Check a supplied code against a request to see if it is valid
      description: "Allows a code to be checked against an existing Verification request.\n  <blockquote>\n    <strong>Note\
        \ on using Silent Authentication:</strong><br><br>\n    If you are checking a code against a Silent Authentication\
        \ workflow, you will only\n    have <strong>one attempt</strong> to submit the code, as this should be handled by\
        \ a Client SDK.\n  </blockquote>"
      tags:
      - Verify
      security:
      - basicAuth: []
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CheckCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSubmitSuccess'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        '410':
          $ref: '#/components/responses/ErrorResponse410'
        '429':
          $ref: '#/components/responses/ErrorResponse429'
        '500':
          $ref: '#/components/responses/ErrorResponse500'
    delete:
      operationId: cancelRequest
      summary: Cancel a verification.
      description: If a verification request is still active, it aborts the workflow. <br /><br /><b>Cancellation is only
        possible 30 seconds after the start of the verification request and before the second event (either TTS or SMS) has
        taken place.</b><br /><br />
      tags:
      - Verify
      security:
      - basicAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '500':
          $ref: '#/components/responses/ErrorResponse500'
  /{request_id}/next_workflow:
    post:
      security:
      - basicAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/request_id'
      operationId: nextWorkflow
      summary: Next workflow
      description: Move the request onto the next workflow, if available.
      tags:
      - Verify
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '402':
          $ref: '#/components/responses/ErrorResponse402'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409NextWorkflow'
        '500':
          $ref: '#/components/responses/ErrorResponse500'
  /{request_id}/silent-auth/redirect:
    get:
      parameters:
      - $ref: '#/components/parameters/request_id'
      operationId: silentAuthCheck
      summary: Attempt Silent Authentication completion
      description: "This is a URL that is returned from a new Silent Authentication request as `check_url` (or can also be\
        \ obtained from the Silent Authentication webhook event, if your integration is asynchronous.) Performing a GET request\
        \ on the URL provided will return a series of 30x redirects to follow. Following these 30xs will result in either\
        \ success containing a `code` to submit or an error.\n<blockquote>\n  <strong>Note on Cellular Usage:</strong>\n \
        \   <br><br>\n    This URL (i.e. the `check_url`) <b>must</b> be hit by a device using cellular data in order for\
        \ Silent Authentication to work correctly.\n</blockquote>\nNote that errors will also be included as a fragment within\
        \ the URL for the frontend to parse. These will take the following example format: <br><br> <code>https:\\\\example.com\\\
        silent-auth\\your-callback-route#error_description=The silent auth verification cannot be completed.</code> <br><br>\
        \ The possible error messages are as follows: <ul>\n  <li>The silent auth verification cannot be completed.</li>\n\
        \  <li>Device MSISDN does not match.</li>\n  <li>Device number does not resolve to a supported Mobile Network Operator.</li>\n\
        \  <li>IP Address does not resolve to a cellular device.</li>\n</ul>"
      tags:
      - Verify
      responses:
        '200':
          description: Carrier Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilentAuthConfirmationSuccess'
        '302':
          description: Redirection(s) to complete carrier check. Can also be other 30x HTTP responses depending on the territory
            and routing.
          headers:
            Location:
              description: URL to redirect to
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse401'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
        '409':
          $ref: '#/components/responses/ErrorResponse409'
        '412':
          $ref: '#/components/responses/ErrorResponse412'
        '500':
          $ref: '#/components/responses/ErrorResponse500'
  /templates:
    get:
      operationId: listTemplates
      summary: List all templates
      description: "<blockquote>\n  <strong>Note on using Custom Templates:</strong><br><br>\n  Writing Custom Templates is\
