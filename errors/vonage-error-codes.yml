      resolution: Visit the Dashboard and check your credentials.
    - code: '5'
      description: Internal Error. An error has occurred in the platform whilst processing this message.
      resolution: If the error persists, contact support .
    - code: '6'
      description: Invalid Message. The platform was unable to process this message, for example, an un-recognized
