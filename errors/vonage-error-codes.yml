      description: Message Too Long. The message length exceeds the maximum allowed.
      resolution: Send shorter messages.
    - code: '14'
      description: Invalid Signature. The signature supplied could not be verified.
      resolution: Check the documentation for signing messages or use one of the SDKs to handle the signing.
    - code: '15'
      description: Invalid Sender Address. You are using a non-authorized sender ID in the from field.
      resolution: This is most commonly seen in North America, where a Vonage long virtual number or short code
        is required.
    - code: '17'
      description: Message Blocked by Provider. The messaging provider has chosen to block this message. This may
        be due to content or restrictions imposed by the provider.
      resolution: N/A
    - code: '22'
      description: Invalid Network Code. The network code supplied was either not recognized, or does not match
        the country of the destination address.
      resolution: Check the network code or remove it from your request.
    - code: '23'
      description: Invalid Callback Url. The callback URL supplied was either too long or contained illegal characters.
      resolution: Supply a valid URL for the callback.
    - code: '29'
      description: Non-Whitelisted Destination. Your Vonage account is still in demo mode. While in demo mode you
        must add target numbers to your whitelisted destination list.
      resolution: Top-up your account to remove this limitation.
    - code: '32'
      description: Signature And API Secret Disallowed. A signed request may not also present an api_secret .
      resolution: Remove the API secret from your request, or don't sign the message.
    - code: '33'
      description: Number De-activated. The number you are trying to send messages to is de-activated and may not
        receive them.
      resolution: N/A
