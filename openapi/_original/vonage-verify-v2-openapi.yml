x-webhooks:
  request-status-update:
    '{$request.body#/callback}':
      post:
        summary: Request status update
        operationId: request-status-update
        x-example-path: /webhooks/request-status-update
        description: An inbound status update for a particular request.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResource'
  events:
    '{$request.body#/callback}':
      post:
        summary: Events Callback
        operationId: event-callback
        x-example-path: /webhooks/events-callback
        description: An inbound events webhook.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResourceEventCallBackExample'
  silent-auth-callback:
    '{$request.body#/callback}':
      post:
        summary: Silent Auth Request Update
        operationId: silent-auth-update
        x-example-path: /webhooks/request-status-update
        description: An inbound request update for an Asynchronous Silent Authentication workflow.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySilentAuth'
components:
  requestBodies:
    CheckCodeRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/CheckCodeByCode'
            - $ref: '#/components/schemas/CheckCodeByToken'
    VerificationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              locale:
                $ref: '#/components/schemas/Language'
              channel_timeout:
                $ref: '#/components/schemas/ChannelTimeout'
              client_ref:
                $ref: '#/components/schemas/ClientRef'
              code_length:
                $ref: '#/components/schemas/CodeLength'
              code:
                $ref: '#/components/schemas/Code'
              brand:
                $ref: '#/components/schemas/Brand'
              template_id:
                $ref: '#/components/schemas/TemplateId'
              fraud_check:
                $ref: '#/components/schemas/FraudCheck'
              workflow:
                type: array
                minItems: 1
                maxItems: 3
                description: Defines the sequence of actions (max 3) that Vonage uses to reach the end-user you want to verify
                  with a PIN code. See [documentation](https://developer.vonage.com/en/verify/concepts/workflow)
                items:
                  oneOf:
                  - $ref: '#/components/schemas/SilentAuthChannel'
                  - $ref: '#/components/schemas/RCSChannel'
                  - $ref: '#/components/schemas/SMSChannel'
                  - $ref: '#/components/schemas/WhatsAppChannel'
                  - $ref: '#/components/schemas/VoiceChannel'
                  - $ref: '#/components/schemas/MailChannel'
                example:
                - channel: silent_auth
                  to: '44770090000'
                  redirect_url: https://acme-app.com/sa/redirect
                - channel: sms
                  to: '44770090000'
                - channel: voice
                  to: '44770090000'
    CreateTemplateRequest:
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                minLength: 1
                maxLength: 64
                pattern: ^[A-Za-z0-9_-]+$
                description: Reference name for template.
                example: my-template
    CreateTemplateFragmentRequest:
      content:
        application/json:
          schema:
            type: object
            required:
            - channel
            - locale
            - text
            properties:
              channel:
                $ref: '#/components/schemas/channel'
              locale:
                $ref: '#/components/schemas/locale'
              text:
                $ref: '#/components/schemas/text'
    PatchTemplateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                description: Reference name for template.
                example: my-template
              is_default:
                $ref: '#/components/schemas/is_default'
    PatchTemplateFragmentRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - text
            properties:
              text:
                $ref: '#/components/schemas/text'
  parameters:
    request_id:
      name: request_id
      in: path
      required: true
      description: ID of the verify request
      schema:
        type: string
    template_id:
      name: template_id
      required: true
      in: path
      description: The template UUID
      schema:
        type: string
      example: 22f571c1-f41a-4db2-bba7-f23a069200c1
    template_fragment_id:
      name: template_fragment_id
      required: true
      in: path
      description: The template fragment UUID
      schema:
        type: string
      example: 22f571c1-f41a-4db2-bba7-f23a069200c1
    page_size:
      name: page_size
      in: query
      description: Amount of templates per page
      schema:
        type: integer
      example: 10
    page:
      name: page
      in: query
      description: The page number
      schema:
        type: integer
      example: 2
  schemas:
    SilentAuthChannel:
      title: Silent Auth
      x-tab-id: WorkflowSilentAuth
      type: object
      required:
      - channel
      - to
      properties:
        channel:
          type: string
          description: The channel
          enum:
          - silent_auth
          example: silent_auth
        to:
          $ref: '#/components/schemas/ToSilentAuth'
        redirect_url:
          $ref: '#/components/schemas/Redirect'
        coverage_check:
          $ref: '#/components/schemas/CoverageCheck'
        mode:
          $ref: '#/components/schemas/Mode'
    SMSChannel:
      title: SMS
      type: object
      required:
      - channel
      - to
      properties:
        channel:
          type: string
          description: The channel
          enum:
          - sms
          example: sms
        to:
          $ref: '#/components/schemas/To'
        from:
          $ref: '#/components/schemas/FromSms'
        entity_id:
          type: string
          description: Optional PEID required for SMS delivery using Indian Carriers
          minLength: 1
          maxLength: 20
          example: '1101407360000017170'
        content_id:
          type: string
          description: Optional value corresponding to a templateID for SMS delivery using Indian Carriers
          minLength: 1
          maxLength: 20
          example: '1107158078772563946'
        app_hash:
          type: string
          description: Optional Android Application Hash Key for automatic code detection on a user's device.
          minLength: 11
          maxLength: 11
