    ChannelTimeout:
      type: integer
      description: Specifies the wait time in seconds between attempts to deliver the verification code. On the Verify Success
        pricing model, the minimum `channel_timeout` is fixed at `60` seconds and cannot be changed; and if you are using
        Silent Authentication, the `channel_timeout` is always fixed at `60` seconds, irrespective of the pricing model.
      minimum: 15
      maximum: 900
      default: 180
      example: 180
    Language:
      type: string
      description: 'Languages that are available to use. See the full list of supported languages in the [Verify Languages
        Guide](https://developer.vonage.com/en/verify/guides/verify-v2-languages). It has no effect if the `channel` is `silent_auth`.

        '
      example: es-es
      default: en-us
    To:
      type: string
      minLength: 1
      maxLength: 50
      example: '447700900000'
      description: The phone number to contact, in the [E.164](https://en.wikipedia.org/wiki/E.164) format. Don't use a leading
        + or 00 when entering a phone number, start with the country code, for example, 447700900000.
    CoverageCheck:
      type: boolean
      description: Controls network coverage lookup. If `true`, a synchronous error is returned when the network is unsupported.
        If `false` a `check_url` is always returned and errors are reported via callbacks.
      default: true
      example: false
    FraudCheck:
      type: boolean
      description: Enables fraud checking for the verification request. When set to `true`, the request is checked against
        fraud detection rules and may be blocked if identified as fraudulent. This feature requires an account capability
        — contact [support](https://api.support.vonage.com) to enable it on your account.
      default: false
      example: true
    Redirect:
      type: string
      description: Optional final redirect added at the end of the `check_url` request/response lifecycle. See the documentation
        for integrations. Will contain the `request_id` and `code` as a url fragment after the URL.
      example: https://acme-app.com/sa/redirect
    Mode:
      type: string
      example: advanced
      default: standard
      enum:
      - standard
      - advanced
      description: An optional parameter to specify whether to use Silent Authentication Advanced.
    Code:
      type: string
      minLength: 4
      maxLength: 10
      pattern: ^[a-zA-Z0-9]+$
      example: e4dR1Qz
      description: An optional alphanumeric custom code to use if you don't want Vonage to generate the code. Only the Verify
        Conversion pricing model allows using this parameter, and it has no effect if the `channel` is `silent_auth`. If you
        provide a custom code, you must complete the verification flow by calling the `/check` endpoint with that PIN. For
        additional details, refer to [the documentation](https://developer.vonage.com/en/verify/guides/v2-anti-fraud?source=verify).
    TemplateId:
      type: string
      example: 4ed3027d-8762-44a0-aa3f-c393717413a4
      description: A custom template ID to use. This parameter works only when `channel` is `sms` or `rcs`.
    ToSilentAuth:
      type: string
      minLength: 1
      maxLength: 50
      example: '447700900000'
      description: The phone number to use for authentication, in the [E.164](https://en.wikipedia.org/wiki/E.164) format.
        Don't use a leading + or 00 when entering a phone number, start with the country code, for example, 447700900000.
    FromRcs:
      type: string
      minLength: 1
      maxLength: 15
      example: agentname
      description: An sender identifier in alphanumeric format.
    FromWhatsApp:
      type: string
      minLength: 1
      maxLength: 50
      example: '447700400080'
      description: A WABA connected sender number, in the [E.164](https://en.wikipedia.org/wiki/E.164) format. Don't use a
        leading + or 00 when entering a phone number, start with the country code, for example, 447700900000.
    FromSms:
      type: string
      minLength: 1
      maxLength: 15
      example: '447700400080'
      description: An optional sender identifier in either numeric or alphanumeric format. The maximum length is 11  characters
        for alphanumeric and 15 for numeric. When numeric, it must be in the [E.164](https://en.wikipedia.org/wiki/E.164)
        format. Don't use a leading + or 00 when entering a phone number - start with the country code, for example `447700900000`.  If
        no `from` identifier is given, the request will default to the `brand`.
    ToEmail:
      type: string
      format: email
      example: alice@company.com
      description: The email address to send the verification request to.
    FromEmail:
      type: string
      format: email
      example: bob@company.com
      description: The email address to send the verification request from.
    CodeLength:
      type: integer
      description: Length of the code to send to the user. It applies to all channels defined in the workflow.
      default: 4
      example: 4
      enum:
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
    ReuseCode:
      type: boolean
      description: Use the same PIN code across multiple channels within a workflow
      default: false
      example: true
    ClientRef:
      type: string
      description: If the `client_ref` is set when the request is sent, it will be included in the callbacks
      minLength: 1
      maxLength: 40
      pattern: ^[a-zA-Z0-9]*$
      example: myPersonalRef
    Brand:
      type: string
      minLength: 1
      maxLength: 18
      description: 'The brand that is sending the verification request. Please note that for security reasons, the following
        regex is used to escape this value: `^[^\/{}:$]*$`. A value that fails this check will result in a `422`.'
      example: ACME
    RequestId:
      type: string
      description: The ID of the request
      example: c11236f4-00bf-4b89-84ba-88b25df97315
    TriggeredAt:
      type: string
      format: date-time
      description: The date and time the verification request was triggered, in ISO 8601 format.
      example: '2020-01-01T14:00:00.000Z'
    Type:
      type: string
      description: Type of response
      example: event
    WhatsAppMode:
      type: string
      description: Defines the WhatsApp verification experience. Use `zero_tap` for automatic verification on Android apps.
        Defaults to `otp_code`.
      enum:
      - zero_tap
      - otp_code
      default: otp_code
      example: zero_tap
    VerifyResource:
      required:
      - request_id
      - submitted_at
      - status
      - type
      - channel_timeout
      - workflow
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        submitted_at:
          type: string
          format: date-time
